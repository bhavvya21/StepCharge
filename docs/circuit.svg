<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title desc">
<title id="title">StepCharge reference circuit</title><desc id="desc">Piezo AC output connects to a full-wave bridge. Bridge positive supplies VCAP, storage capacitor, required limiter, optional switched load and a 100 kiloohm divider. A 1 kiloohm resistor connects the divider to GPIO34 with 100 nanofarad filtering and required ADC protection. A normally open switch connects GPIO27 to common ground. USB independently powers the ESP32.</desc>
