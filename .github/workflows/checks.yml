name: StepCharge checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node app/build-standalone.mjs
      - run: git diff --exit-code -- app/StepCharge.html
      - run: node --test tests/telemetry.test.mjs tests/standalone.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: pip install platformio==6.1.18
      - run: pio run
